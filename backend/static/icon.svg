<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#020804"/>
  <!-- Malai padi / Rice ear cluster — centered, tilted ~35deg -->
  <g transform="translate(90,90) rotate(-35)">
    <!-- Main stalk -->
    <line x1="0" y1="55" x2="0" y2="-50" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <!-- Grain row 1 (bottom) -->
    <ellipse cx="-16" cy="35" rx="12" ry="8" fill="#22c55e" transform="rotate(30,-16,35)"/>
    <ellipse cx="16"  cy="30" rx="12" ry="8" fill="#22c55e" transform="rotate(-30,16,30)"/>
    <!-- Grain row 2 -->
    <ellipse cx="-17" cy="12" rx="12" ry="8" fill="#22c55e" transform="rotate(30,-17,12)"/>
    <ellipse cx="17"  cy="8"  rx="12" ry="8" fill="#22c55e" transform="rotate(-30,17,8)"/>
    <!-- Grain row 3 -->
    <ellipse cx="-16" cy="-12" rx="12" ry="8" fill="#22c55e" transform="rotate(30,-16,-12)"/>
    <ellipse cx="16"  cy="-16" rx="12" ry="8" fill="#22c55e" transform="rotate(-30,16,-16)"/>
    <!-- Top grain -->
    <ellipse cx="0" cy="-38" rx="10" ry="7" fill="#22c55e"/>
    <!-- Branch lines from stalk to grains -->
    <line x1="0" y1="37"  x2="-12" y2="35"  stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="32"  x2="12"  y2="30"  stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="14"  x2="-13" y2="12"  stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="9"   x2="13"  y2="8"   stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="-12" y2="-12" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-15" x2="12"  y2="-16" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>